id: es-ripree
name: RIPREE
authorityId: es-miteco
registry:
  url: https://energia.serviciosmin.gob.es/Ripree/ExportarEmpresas/Export
  observationType: OFFICIAL_ASSIGNMENT
  supportedRoles:
    - CPO
    - EMSP
publication:
  connector: es-ripree
  machineReadableUrl: https://energia.serviciosmin.gob.es/Ripree/ExportarEmpresas/GenerarXml
  refreshSchedule: weekly
  enabled: true
  verifiedAt: 2026-07-10
  safety:
    maxDeletionRatio: 0.3
    maxChangeRatio: 0.8
    maxParseErrorRatio: 0.1
reuse:
  status: statutory
  legalBasis:
    name: Spanish Law 37/2007 on reuse of public-sector information
    url: https://www.boe.es/eli/es/l/2007/11/16/37/con
  licence: null
  attributionNotice: Cite RIPREE as the source and state the last update date.
  redistributionAllowed: true
  notes: >
    Reuse is based on legislation, as amended for the transposition of Directive (EU)
    2019/1024, and not on an explicit open-data licence.
notes: >
  RIPREE is Spain's authoritative registry. The public company export page exposes CSV
  and XML actions; the connector posts to the documented XML source and normalizes
  CPO/EMSP CodigoId values. Open IDRO Directory is an independent aggregation and does
  not replace RIPREE.
