notes: >
  Traficom is Finland's IDRO and issues and manages AFIR IDs. This connector parses
  Traficom's public HTML table of issued IDs. Fintraffic separately maintains Finland's
  National Access Point and publishes charging infrastructure data; it is not the source
  of this IDRO register. The page also lists other observed IDs, but those are not
  normalized because their roles are not explicit.
