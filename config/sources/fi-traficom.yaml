reuse:
  status: licensed
  legalBasis: null
  licence:
    name: CC BY 4.0
    url: https://traficom.fi/en/transport-system/geoinformationsmaterial/use-and-licences-data
  attributionNotice: >
    Cite the Finnish Transport and Communications Agency Traficom as the source,
    preserve copyright and disclaimer information, link to the original material and CC
    BY 4.0 licence where possible, and identify modifications.
  redistributionAllowed: true
  notes: >
