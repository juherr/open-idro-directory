notes: >
  The National Roads Authority, operating as Transport Infrastructure Ireland,
  is appointed as Ireland's IDRO under S.I. No. 52 of 2026
  (https://www.irishstatutebook.ie/2026/en/si/0052.html). TII publishes the
  official Irish IDRO public register as a PDF. The connector extracts text from
  the PDF and normalizes the IDRO-issued party ID for CPO and eMSP rows. Open
  IDRO Directory is an independent aggregation and is not an official TII
  service.
